name: Sync Garmin running data

on:
  schedule:
    # 03:00 and 15:00 UTC daily. Garmin activities usually sync from watch to
    # Garmin Connect within minutes, so this catches most runs same-day.
    # Adjust to taste - cron times are UTC.
    - cron: "0 3,15 * * *"
  workflow_dispatch: {} # lets you trigger a sync on demand, e.g. from the GitHub mobile app

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Garmin session token
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokenstore

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python sync_garmin.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Sync Garmin running data"
          git push
