name: Sync Garmin running data

on:
  workflow_dispatch: {} # trigger manually from the Actions tab, e.g. via the GitHub mobile app after a run

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Garmin session token
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          # Cache entries are immutable. Use a unique key so refreshed tokens
          # are saved after every run, then restore the newest prior entry.
          # v2 also avoids restoring the now-expired legacy fixed-key cache.
          key: garmin-tokenstore-v2-${{ github.run_id }}
          restore-keys: |
            garmin-tokenstore-v2-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python sync_garmin.py

      - name: Commit and push latest run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "Sync latest Garmin run"
          git push
